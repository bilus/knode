name:                knode
version:             0.1.0.0
github:              "bilus/knode"
license:             BSD-3-Clause
author:              "Marcin Bilski"
maintainer:          "gyamtso@gmail.com"
copyright:           "2026 Marcin Bilski"

extra-source-files:
- README.md
- CHANGELOG.md

description:         Wiki tool for AI agents

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Knode.Wiki
  dependencies:
    - shelly
    - text
    - mtl
    - aeson
    - filepath
    - bytestring

executables:
  knode-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - knode
    - text
    - mtl

tests:
  knode-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - knode
